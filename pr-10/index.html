<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ede7d8" />
  <title>Trade Winds · The Venetian Sea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
  <script type="module" crossorigin src="./assets/index-KP219voT.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-Cv8vOB8r.css">
</head>
<body>
  <div class="app">
    <main>
      <section class="map-shell" aria-label="Interactive map of the Mediterranean">
        <div class="map-viewport" tabindex="0" role="region" aria-label="Trading map; scroll horizontally to explore"><div id="game"><div id="port-layer" class="labels-hidden" aria-label="Harbors"></div><div id="ship-layer" aria-hidden="true"></div></div></div>
        <div class="map-tools" aria-label="Map controls"><span class="map-brand">✳ TRADE WINDS</span><span id="treasury"></span><button type="button" id="landscape-menu-toggle" aria-expanded="false" aria-controls="landscape-controls">Map controls</button><div id="landscape-controls"><button type="button" id="harbor-labels-toggle" class="labels-toggle" aria-pressed="false" aria-controls="port-layer">Harbor labels: off</button><div class="goods-control"><button type="button" id="goods-toggle" aria-expanded="false" aria-controls="goods-key">Goods &amp; handling</button><div id="goods-key" class="tool-panel" role="region" aria-label="Goods and handling intervals" hidden></div></div><div class="voyages-control"><button type="button" id="voyages-toggle" aria-expanded="false" aria-controls="routes">Voyages <span id="route-count">0</span></button><div id="routes" class="tool-panel" role="region" aria-label="Active voyages" hidden></div></div></div></div>
        <div id="map-announcement" class="visually-hidden" role="status" aria-live="polite">Select a starting harbor, then a destination.</div>
        <div id="route-popover" class="route-popover" role="region" aria-label="Route planning" hidden><span id="map-instruction"></span><div class="route-actions"><button id="confirm-route" type="button" hidden>Establish route</button></div></div>
        <section id="town-info-popover" class="town-info-popover" role="dialog" aria-labelledby="town-info-title" hidden>
          <button class="town-info-close" type="button" aria-label="Close town information">×</button>
          <p class="town-info-kicker">HARBOR LEDGER</p><h2 id="town-info-title" data-town-name></h2>
          <div class="town-stat"><span class="town-stat-icon" aria-hidden="true">OUT</span><div><strong>Produces <span data-produced></span></strong><span class="town-stat-detail" data-production-rate></span><span class="town-stat-detail" data-stock></span></div></div>
          <div class="town-stat"><span class="town-stat-icon" aria-hidden="true">IN</span><div><strong>Consumes <span data-consumed></span></strong><span class="town-stat-detail" data-consumption-rate></span><span class="town-stat-detail" data-consumed-count></span></div></div>
          <p class="town-stat-note">Consumption occurs only when a compatible cargo unloads here.</p>
        </section>
        <div class="map-help"><span id="map-help-text">Select two harbors to trade</span> <span>· Scroll map to explore</span></div>
      </section>
    </main>
  </div>
</body></html>
