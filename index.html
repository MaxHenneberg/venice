<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#ede7d8" />
  <title>Trade Winds · The Venetian Sea</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Serif+Display:ital@0;1&display=swap" rel="stylesheet">
</head>
<body>
  <div class="app">
    <main>
      <section class="map-shell" aria-label="Interactive map of the Mediterranean">
        <div class="map-viewport" tabindex="0" role="region" aria-label="Trading map; scroll horizontally to explore"><div id="game"><div id="port-layer" class="labels-hidden" aria-label="Harbors"></div><div id="ship-layer" aria-hidden="true"></div></div></div>
        <div class="map-tools" aria-label="Map controls"><span class="map-brand">✳ TRADE WINDS</span><span id="treasury"></span><button type="button" id="harbor-labels-toggle" class="labels-toggle" aria-pressed="false" aria-controls="port-layer">Harbor labels: off</button><div class="goods-control"><button type="button" id="goods-toggle" aria-expanded="false" aria-controls="goods-key">Goods &amp; handling</button><div id="goods-key" class="tool-panel" role="region" aria-label="Goods and handling intervals" hidden></div></div><div class="voyages-control"><button type="button" id="voyages-toggle" aria-expanded="false" aria-controls="routes">Voyages <span id="route-count">0</span></button><div id="routes" class="tool-panel" role="region" aria-label="Active voyages" hidden></div></div><button id="cancel-selection" type="button" hidden>Cancel</button></div>
        <div id="map-announcement" class="visually-hidden" role="status" aria-live="polite">Select a starting harbor, then a destination.</div>
        <div id="route-popover" class="route-popover" role="region" aria-label="Route planning" hidden><span id="map-instruction"></span><div class="route-actions"><button id="confirm-route" type="button" hidden>Establish route</button><button id="cancel-quote" type="button">Cancel</button></div></div>
        <div class="map-help"><span id="map-help-text">Select two harbors to trade</span> <span>· Scroll map to explore</span></div>
      </section>
    </main>
  </div><script type="module" src="/src/main.js"></script>
</body></html>
